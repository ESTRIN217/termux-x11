ext.termuxX11VersionName = {
    // Configuration-cache safe external process (providers.exec), same result as
    // the old 'git ...'.execute() invocation.
    def commit = ""
    try {
        commit = providers.exec {
            workingDir = project.projectDir
            commandLine("git", "rev-parse", "--verify", "--short", "HEAD")
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        commit = ""
    }
    def version = "1.03.01"
    "${version}-${commit.length() == 1 ? "nongit" : commit}-${(new Date()).format("dd.MM.yy")}"
}()

// Single source of truth for the NDK version. Anything building :lorie (this repo's own
// lorie-app, or a host app integrating it) should read this instead of letting AGP pick its
// own default, otherwise :lorie's CMake config differs between them and its native code gets
// compiled twice.
// Terminal host (spec 014): when the host repo pins an NDK version via its gradle
// .properties, honor it so both modules share one toolchain; upstream standalone
// builds keep 29.0.14206865.
ext.termuxX11NdkVersion = { (rootProject.findProperty('ndkVersion') ?: "29.0.14206865").toString() }()
